[package]
name = "finans-server"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Finans sunucusu: hesaplar ve kullanıcı verisi (SQLite ya da Postgres) üzerinde REST API"

[dependencies]
finans-core = { path = "../finans-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "io-util", "sync"] }
# Ekstre ayrıştırma alt sürecine bellek sınırı (setrlimit)
libc = "0.2"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled": SQLite C kaynağı derlenip gömülür; sistemde SQLite kurulu olması gerekmez
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
# TLS (bağlantı adresinde sslmode=require); varsayılan "prefer": sunucu TLS sunmuyorsa şifresiz devam eder
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

[profile.release]
opt-level = "s"
lto = true
strip = true
# Ekstre ayrıştırıcısındaki panikler catch_unwind ile yakalanır
panic = "unwind"
